[project]
name = "strict-toml-config"
version = "0.1.0"
description = "Strict TOML config loader: unknown keys, wrong types and out-of-range values fail at read time, naming the file and key path."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# tomllib 是 3.11 才进的标准库 —— 这是硬下界，不是随手写的
requires-python = ">=3.11"
authors = [{ name = "bytejf" }]
keywords = ["toml", "config", "configuration", "validation", "strict", "tomllib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/bytejf/strict-toml-config"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strict_toml_config"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# 注释与文档用中文写，全角标点（，。：；）会命中「容易与 ASCII 混淆」那三条。
# 它们防的是「用长得像 ASCII 的字符冒充 ASCII」，而这里就是中文，不适用
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
